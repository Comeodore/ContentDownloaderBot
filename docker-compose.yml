# CONTENTDL_DATA_DIR is mounted into both containers at the same path, so the
# Bot API server can send files by path (up to 2 GB).

services:
  # ── Local Telegram Bot API server (lifts the 50 MB limit to 2 GB) ──
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: contentdl-bot-api-1
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"               # read files from disk by path
    volumes:
      - ${CONTENTDL_DATA_DIR:-./data}:/var/lib/telegram-bot-api
    networks:
      - contentdl
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── The bot ──
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: contentdl-bot:latest
    container_name: contentdl-bot-1
    restart: unless-stopped
    env_file: ./.env
    environment:
      TELEGRAM_API_BASE: http://telegram-bot-api:8081
      DOWNLOAD_DIR: /var/lib/telegram-bot-api/downloads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-1900}
      YTDLP_AUTO_UPDATE_HOURS: ${YTDLP_AUTO_UPDATE_HOURS:-24}
      COOKIES_FILE: ${COOKIES_FILE:-}
    depends_on:
      - telegram-bot-api
    volumes:
      # Same dir and path as the server, or path mode can't find the files
      - ${CONTENTDL_DATA_DIR:-./data}:/var/lib/telegram-bot-api
    networks:
      - contentdl
    labels:
      # Built locally; yt-dlp updates itself on restart.
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No Watchtower here: the host's shared one updates contentdl-bot-api-1, and a
# second unscoped instance would stop and remove the first.

networks:
  contentdl:
    driver: bridge
